# Deploy lên Cloudflare Pages. Đi đường này thay vì Connect to Git trên dashboard:
# import repo từ mục Workers sẽ dựng ra Workers Build chạy `wrangler deploy` và hỏng,
# vì app dùng Pages Functions (functions/api/[[path]].ts).
#
# Cần hai secret trong repo (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token có quyền "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  account id lấy ở trang chủ dashboard
name: Deploy Pages

env:
  WRANGLER_SEND_METRICS: "false"

on:
  push:
    branches: [dev]
  workflow_dispatch:

# Đẩy liên tiếp thì chỉ giữ lần cuối, nhưng không cắt ngang lần đang deploy dở.
concurrency:
  group: pages-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Chặn trước: hỏng test hoặc hỏng type thì đừng đẩy lên production.
      - run: npm test
      - run: npm run build

      # Secret rỗng thì wrangler chỉ báo "Not logged in" — câu đó không hề gợi ý
      # nguyên nhân, nên chặn ở đây và nói thẳng chỗ cần sửa.
      - name: Kiểm tra secret Cloudflare
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Thiếu secret:$missing — thêm ở Settings → Secrets and variables → Actions → New repository secret (phải là repository secret, không phải environment secret)."
            exit 1
          fi
          echo "Đã có cả hai secret."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy sẽ hỏng nếu project Pages chưa tồn tại, mà lần đầu thì chưa có.
      - name: Đảm bảo project Pages tồn tại
        run: |
          if npx wrangler pages project list | grep -qE '(^|[[:space:]|])cf-spending([[:space:]|]|$)'; then
            echo "Project cf-spending đã có"
          else
            npx wrangler pages project create cf-spending --production-branch=dev
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: wrangler pages deploy
        run: >
          npx wrangler pages deploy
          --project-name=cf-spending
          --branch=${{ github.ref_name }}
          --commit-hash=${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
